name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      scanner: ${{ steps.filter.outputs.scanner }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'db/migrations/**'
              - 'services/scanner/tests/fixtures/broker_adjust_cases.json'
              - '.github/workflows/ci.yml'
            scanner:
              - 'services/scanner/**'
              - 'db/migrations/**'
              - '.github/workflows/ci.yml'
            db:
              - 'db/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Apply migrations
        working-directory: db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal?sslmode=disable
          DBMATE_NO_DUMP_SCHEMA: "true"
        run: |
          npm ci
          npx dbmate --migrations-dir migrations up
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  scanner:
    needs: changes
    if: needs.changes.outputs.scanner == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal
    defaults:
      run:
        working-directory: services/scanner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: db/package-lock.json
      - name: Apply migrations
        working-directory: db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal?sslmode=disable
          DBMATE_NO_DUMP_SCHEMA: "true"
        run: |
          npm ci
          npx dbmate --migrations-dir migrations up
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/scanner/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict scanner tests
      - run: uv run pytest --cov=scanner --cov-report=term

  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal?sslmode=disable
      DBMATE_NO_DUMP_SCHEMA: "true"
    defaults:
      run:
        working-directory: db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: db/package-lock.json
      - run: npm ci
      - name: Apply, roll back, and reapply every migration
        run: |
          npx dbmate --migrations-dir migrations up
          npx dbmate --migrations-dir migrations rollback
          npx dbmate --migrations-dir migrations rollback
          npx dbmate --migrations-dir migrations up
      - name: Admin seed is idempotent
        env:
          SEED_ADMIN_EMAIL: Admin@Example.com
        run: |
          ./migrate.sh
          ./migrate.sh
          test "$(psql "$DATABASE_URL" -tAc "select role from users where email = 'admin@example.com'")" = admin
