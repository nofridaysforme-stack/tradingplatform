[project]
name = "scanner"
version = "0.1.0"
description = "Trade Signal Portal worker: data, rules, strategies, notifications, backtest"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary,pool]>=3.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pywebpush>=2.5.0",
    "resend>=2.49.0",
    "ta-lib>=0.6.5",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "DTZ", "PL", "ANN"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR"]
# HTML and CSS templates read better unwrapped.
"scanner/backtest/report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.mypy.overrides]]
# APScheduler 3 ships without type information.
module = ["apscheduler.*"]
ignore_missing_imports = true
